{{- if .Values.service.enabled }}
{{- $annotations := merge (dict "helm.sh/hook" "test" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded") (fromYaml (include "locust-load-tester.annotations" .)) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "locust-load-tester.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "locust-load-tester.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "locust-load-tester.serviceAccountName" . }}
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: wget
      image: busybox:1.37
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      command: ["wget"]
      args:
        - --spider
        - -S
        - -T
        - "10"
        - http://{{ include "locust-load-tester.fullname" . }}:{{ .Values.service.port }}/
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
{{- end }}
