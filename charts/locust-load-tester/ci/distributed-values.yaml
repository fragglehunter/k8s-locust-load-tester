# ct: chart-testing values — distributed master + workers.
# Covers: mode=distributed, the master Deployment, the worker Deployment, the
# headless Service workers dial on 5557, --expect-workers, per-worker resources
# and locustfile.extraFiles mounted alongside the locustfile in /config.
#
# targetHost is the CoreDNS metrics endpoint that kubeadm/kind always exposes on
# the kube-dns Service, so nothing extra has to be installed in the test cluster.

mode: distributed

locust:
  targetHost: http://kube-dns.kube-system.svc.cluster.local:9153
  users: 6
  spawnRate: 3
  runTime: 1m
  headless: true
  onlySummary: true
  loglevel: INFO
  # Master blocks until both workers have checked in, which is the thing this
  # permutation is really testing.
  expectWorkers: 2

workload:
  kind: Deployment

replicaCount: 1

worker:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  podLabels:
    locust.io/role: worker

locustfile:
  name: locustfile.py
  content: |-
    import pathlib

    from locust import HttpUser, between, task

    # Read from the extraFiles entry below, mounted next to this file in /config.
    _paths_file = pathlib.Path("/config/paths.txt")
    PATHS = (
        [line.strip() for line in _paths_file.read_text().splitlines() if line.strip()]
        if _paths_file.exists()
        else ["/metrics"]
    )


    class CoreDNSMetricsUser(HttpUser):
        wait_time = between(0.5, 1.0)

        @task
        def scrape(self):
            for path in PATHS:
                self.client.get(path, name=f"GET {path}")
  extraFiles:
    paths.txt: |-
      /metrics

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
