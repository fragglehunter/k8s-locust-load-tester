---
# Plain headless, time-boxed run against a .NET service in the same cluster.
#
# The simplest useful shape: one pod, no web UI, run for five minutes, print a summary.
#
# The locustfile ships inside the chart, so there is nothing to pass:
#
#   helm install dotnet-app-loadtest \\
#     oci://ghcr.io/fragglehunter/charts/locust-load-tester \\
#     -f examples/dotnet-app-values.yaml
#
# Follow it with:
#   kubectl logs -f -l app.kubernetes.io/instance=dotnet-app-loadtest --tail=100

mode: standalone

locustfile:
  # Bundled with the chart. `helm show readme` lists every preset.
  preset: dotnet-app

locust:
  targetHost: http://dotnet-8-app:5000
  users: 50
  spawnRate: 10
  runTime: 5m
  headless: true
  onlySummary: true
  csv:
    enabled: true
    prefix: /tmp/dotnet-app
