---
# Sock Shop (microservices-demo) in the `sock-shop` namespace.
#
# Walks catalogue -> detail -> cart -> order, so it touches most of the back end.
#
# The locustfile ships inside the chart, so there is nothing to pass:
#
#   helm install sock-shop-loadtest \
#     oci://ghcr.io/fragglehunter/charts/locust-load-tester -n sock-shop \
#     -f examples/sock-shop-values.yaml
#
# Follow it with:
#   kubectl logs -n sock-shop -f -l app.kubernetes.io/instance=sock-shop-loadtest --tail=100

mode: standalone

locustfile:
  # Bundled with the chart. `helm show readme` lists every preset.
  preset: sock-shop

locust:
  targetHost: http://front-end.sock-shop:80
  users: 40
  spawnRate: 10
  runTime: 5m
  headless: true
  onlySummary: true
  csv:
    enabled: true
    prefix: /tmp/sock-shop
