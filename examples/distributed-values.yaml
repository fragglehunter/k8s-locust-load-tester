---
# Distributed run: one master coordinating four workers.
#
# Reach for this when a single pod can no longer saturate the target. `locust.users`
# and `locust.spawnRate` are CLUSTER TOTALS split across the workers by the master,
# not per-worker numbers.
#
#   helm install big-loadtest \
#     oci://ghcr.io/fragglehunter/charts/locust-load-tester \
#     -f examples/distributed-values.yaml
#
# Workers can be scaled while the test runs; they attach to the live master:
#   kubectl scale deployment/big-loadtest-locust-load-tester-worker --replicas=8

mode: distributed

worker:
  replicaCount: 4
  # Workers do the actual request generation, so give them more than the master.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi

locustfile:
  preset: faces

locust:
  targetHost: http://face
  # Cluster-wide totals, not per worker.
  users: 800
  spawnRate: 50
  runTime: 15m
  headless: true
  onlySummary: true
  # Left empty so it defaults to worker.replicaCount; the master waits for all four
  # before starting, otherwise the early ramp is generated by however many happen to
  # be up and the numbers are not comparable between runs.
  expectWorkers: ""
