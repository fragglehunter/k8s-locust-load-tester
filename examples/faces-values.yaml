---
# Faces demo app (github.com/BuoyantIO/faces-demo) in the `faces` namespace.
#
# Targets the `face` service, not `faces-gui`: `face` is the edge service the browser
# hammers, and it fans out to `smiley` and `color`, so this exercises the whole chain.
#
# Faces injects errors and latency on purpose, so a steady non-zero failure rate is the
# demo working as designed. Add locust.exitCodeOnError=0 if that noise is unhelpful.
#
# The locustfile ships inside the chart, so there is nothing to pass:
#
#   helm install faces-loadtest \\
#     oci://ghcr.io/fragglehunter/charts/locust-load-tester -n faces \\
#     -f examples/faces-values.yaml
#
# Follow it with:
#   kubectl logs -n faces -f -l app.kubernetes.io/instance=faces-loadtest --tail=100

mode: standalone

locustfile:
  # Bundled with the chart. `helm show readme` lists every preset.
  preset: faces

locust:
  targetHost: http://face
  users: 40
  spawnRate: 10
  runTime: 5m
  headless: true
  onlySummary: true
  csv:
    enabled: true
    prefix: /tmp/faces
