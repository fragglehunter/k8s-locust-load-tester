---
# Emojivoto (the Linkerd demo app) in the `emojivoto` namespace.
#
# Emojivoto deliberately fails a fraction of votes, so expect a non-zero failure rate.
#
# The locustfile ships inside the chart, so there is nothing to pass:
#
#   helm install emojivoto-loadtest \\
#     oci://ghcr.io/fragglehunter/charts/locust-load-tester -n emojivoto \\
#     -f examples/emojivoto-values.yaml
#
# Follow it with:
#   kubectl logs -n emojivoto -f -l app.kubernetes.io/instance=emojivoto-loadtest --tail=100

mode: standalone

locustfile:
  # Bundled with the chart. `helm show readme` lists every preset.
  preset: emojivoto

locust:
  targetHost: http://web-svc.emojivoto:80
  users: 30
  spawnRate: 10
  runTime: 5m
  headless: true
  onlySummary: true
  csv:
    enabled: true
    prefix: /tmp/emojivoto
