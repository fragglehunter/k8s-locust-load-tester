---
# Web UI test against emojivoto, the Linkerd demo application.
#
# Serves the Locust web interface and starts the run immediately, so the charts are
# already populated when you open it. Use this shape when you want to watch a run
# happen, change the user count live, or pull a report out of the browser.
#
#   helm install emojivoto-loadtest oci://ghcr.io/fragglehunter/charts/locust-load-tester \
#     -f examples/emojivoto-values.yaml
#
#   kubectl port-forward svc/emojivoto-loadtest-locust-load-tester 8089:8089
#   # then open http://127.0.0.1:8089
#
# Deploy the target first, if you have not already:
#   kubectl apply -f https://run.linkerd.io/emojivoto.yml

mode: standalone

locust:
  # emojivoto's front end: Service "web-svc" on port 80 in namespace "emojivoto".
  targetHost: http://web-svc.emojivoto.svc.cluster.local
  users: 25
  spawnRate: 5
  # The UI keeps serving after the run finishes, so the pod stays up and you can
  # start another run from the browser without reinstalling.
  runTime: 10m
  # headless: false is what serves the UI; autostart begins the run without waiting
  # for someone to press Start. The chart rejects autostart with headless: true.
  headless: false
  autostart: true
  loglevel: INFO

workload:
  kind: Deployment

# The Service the web UI is reached through. Without it you would have to
# port-forward straight to the pod.
service:
  enabled: true
  type: ClusterIP
  port: 8089

# Uncomment to expose the UI properly instead of port-forwarding. Requires
# service.enabled: true, which is already set above.
#
# ingress:
#   enabled: true
#   className: nginx
#   hosts:
#     - host: locust.example.com
#       paths:
#         - path: /
#           pathType: Prefix
#   tls: []

# Readiness gates the Service on the UI actually answering, so a port-forward set up
# straight after `helm install` does not land on a pod that is still starting.
readinessProbe:
  enabled: true

locustfile:
  name: locustfile.py
  # The test from locustfile-emojivoto_v2.py at the repository root: read the
  # leaderboard and the list, then cast ten randomly chosen votes per iteration.
  content: |-
    from locust import HttpUser, TaskSet, task
    from random import choice

    # All emoji choices for voting
    EMOJI_CHOICES = [
        ":joy:", ":sunglasses:", ":doughnut:", ":stuck_out_tongue_winking_eye:", ":money_mouth_face:",
        ":flushed:", ":mask:", ":nerd_face:", ":ghost:", ":skull_and_crossbones:", ":heart_eyes_cat:",
        ":hear_no_evil:", ":see_no_evil:", ":speak_no_evil:", ":boy:", ":girl:", ":man:", ":woman:",
        ":older_man:", ":policeman:", ":guardsman:", ":construction_worker_man:", ":prince:", ":princess:",
        ":man_in_tuxedo:", ":bride_with_veil:", ":mrs_claus:", ":santa:", ":turkey:", ":rabbit:",
        ":no_good_woman:", ":ok_woman:", ":raising_hand_woman:", ":bowing_man:", ":man_facepalming:",
        ":woman_shrugging:", ":massage_woman:", ":walking_man:", ":running_man:", ":dancer:",
        ":man_dancing:", ":dancing_women:", ":rainbow:", ":skier:", ":golfing_man:", ":surfing_man:",
        ":basketball_man:", ":biking_man:", ":point_up_2:", ":vulcan_salute:", ":metal:", ":call_me_hand:",
        ":thumbsup:", ":wave:", ":clap:", ":raised_hands:", ":pray:", ":dog:", ":cat2:", ":pig:",
        ":hatching_chick:", ":snail:", ":bacon:", ":pizza:", ":taco:", ":burrito:", ":ramen:",
        ":champagne:", ":tropical_drink:", ":beer:", ":tumbler_glass:", ":world_map:", ":beach_umbrella:",
        ":mountain_snow:", ":camping:", ":steam_locomotive:", ":flight_departure:", ":rocket:", ":star2:",
        ":sun_behind_small_cloud:", ":cloud_with_rain:", ":fire:", ":jack_o_lantern:", ":balloon:",
        ":tada:", ":trophy:", ":iphone:", ":pager:", ":fax:", ":bulb:", ":money_with_wings:",
        ":crystal_ball:", ":underage:", ":interrobang:", ":100:", ":checkered_flag:", ":crossed_swords:",
        ":floppy_disk:", ":poop:"
    ]

    class WebTasks(TaskSet):

        def on_start(self):
            # Disable SSL warnings
            self.client.verify = False

        @task
        def load(self):
            self.client.get("/api/leaderboard")
            self.client.get("/api/list")

            # Simulate multiple votes randomly
            for _ in range(10):  # can adjust number of votes per task run
                emoji = choice(EMOJI_CHOICES)
                self.client.get(f"/api/vote?choice={emoji}")

    class Web(HttpUser):
        tasks = [WebTasks]
        min_wait = 0
        max_wait = 0

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 512Mi
